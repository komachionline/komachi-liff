<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オンライン診療予約</title>
  <style>
    body {
      margin: 0; min-height: 100vh; padding: 16px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #fff; color: #333; text-align: center;
    }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 16px;
      border: 3px solid #eee; border-top-color: #06c755; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 15px; line-height: 1.7; margin: 0 0 16px; white-space: pre-line; }
    button {
      font-size: 15px; padding: 12px 24px; border: none; border-radius: 8px;
      background: #06c755; color: #fff;
    }
  </style>
</head>
<body>
  <div>
    <div class="spinner" id="spinner"></div>
    <p id="msg">予約フォームを準備しています…</p>
    <button id="retry" hidden>もう一度試す</button>
  </div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = '2012304244-uTpwnqNM';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyo-8gFMiboG0F1NiKk24_CJmXevtfJvbipyr6n1b7eG0EbX3-A3kQ2QY30DamCMs0wjQ/exec';

    function showError(text) {
      document.getElementById('spinner').hidden = true;
      document.getElementById('msg').textContent = text;
      document.getElementById('retry').hidden = false;
    }

    document.getElementById('retry').addEventListener('click', () => {
      try { liff.logout(); } catch (e) {}
      location.reload();
    });

    // お客様のトークから、クリニックへ予約コードを一言送る
    // （管理画面のチャットにお客様が表示され、予約コードで照合できるようにするため）
    // 送れなかった場合も、予約フォームはそのまま開く
    async function sendBookingMessage(code) {
      try {
        if (!liff.isInClient()) return;               // LINEアプリの外で開いた場合は送らない
        const ctx = liff.getContext();
        if (!ctx || !['utou', 'room', 'group'].includes(ctx.type)) return;
        await liff.sendMessages([{
          type: 'text',
          text: '【オンライン診療予約】\n予約フォームを開きました。\n予約コード：' + code,
        }]);
      } catch (e) {
        console.error(e);
      }
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }

        const idToken = liff.getIDToken();
        if (!idToken) throw new Error('ログイン情報を取得できませんでした。');

        const res = await fetch(GAS_URL + '?idToken=' + encodeURIComponent(idToken));
        const data = await res.json();

        if (data.error === 'expired') {
          liff.logout();
          liff.login({ redirectUri: location.href });
          return;
        }
        if (!data.url) throw new Error(data.error || '予約フォームを準備できませんでした。');

        // 新しく予約コードを発行したときだけ、トークに一言送る
        if (data.isNew && data.code) {
          await sendBookingMessage(data.code);
        }

        location.replace(data.url);
      } catch (e) {
        showError('申し訳ありません。予約フォームを開けませんでした。\n時間をおいて、もう一度お試しください。');
        console.error(e);
      }
    }

    main();
  </script>
</body>
</html>
